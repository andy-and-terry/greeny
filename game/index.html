<style>

/* ============================================================

@keyframes jsGrow { from{transform:scale(0.3);} to{transform:scale(1);} }

<!-- ============================================================
     MAIN GAME SCRIPT
     All TODO comments mark spots to swap in your own assets
     ============================================================ -->
<script>
/* ============================================================
   CONSTANTS  — tune these to adjust game feel
   ============================================================ */
var CELL         = 64;
var MAZE_W       = 21;   // must be odd
var MAZE_H       = 21;   // must be odd
var FOV          = Math.PI / 3;
var HALF_FOV     = FOV / 2;
var NUM_RAYS     = 560;
var MAX_DIST     = 22 * 64;  // CELL inline to avoid TDZ
var TOTAL_NB     = 7;
var PLAYER_SPD   = 2.6;
var RUN_SPD      = 4.2;
var TURN_SPD     = 0.048;
var MOUSE_SENS   = 0.0022;

/* ============================================================
   ITEM DEFINITIONS
   Add your item types here.
   TODO: Add an imgSrc field and use ctx.drawImage() in drawItem()
   ============================================================ */
var ITEMS = {
  soda:    { label:'Energy\nFlavored',   color:'#44aaff', effect:'stamina'  },
  whistle: { label:'Principal\nWhistle', color:'#ffdd00', effect:'distract' },
  tape:    { label:'Tape\nPlayer',       color:'#884400', effect:'tape'     },
  scissors:{ label:'Safety\nScissors',  color:'#cc4444', effect:'scissors' }
};

/* ============================================================
   CHARACTER DEFINITIONS
   TODO: Add Principal, Playtime, Bully etc. here
   ============================================================ */
var CHARS = {
  greeny: {
    color:       '#22aa22',
    baseSpeed:   1.6,
    speedPerNB:  0.38,   // gets faster each notebook collected
    catchR:      CELL * 0.85,
    hearR:       CELL * 10,
    losR:        CELL * 14
  }
  /* TODO: Uncomment and fill in for more characters
  ,principal: {
    color:'#4444cc', baseSpeed:2.0, speedPerNB:0,
    catchR:CELL*0.9, hearR:CELL*8, losR:CELL*10
  }
  */
};

/* ============================================================
   LOCALSTORAGE KEY
   All run data saved as array: [{ won, notebooks, timeMs, wrongAnswers, date }, ...]
   ============================================================ */
var SAVE_KEY = 'gamedata';

/* ============================================================
   GAME STATE  — populated by initGame()
   ============================================================ */
var G = {
  state:       'menu',   // 'menu' | 'playing' | 'caught' | 'won'
  player:      null,
  notebooks:   [],
  characters:  [],
  floorItems:  [],
  heldItems:   [null, null, null],
  nbCollected: 0,
  wrongCount:  0,
  startTime:   0,
  endTime:     0,
  mathOpen:    false,
  mathNB:      null,
  mathPhase:   0,
  inDetention: false,
  detTimer:    0,
  showMap:     false,
  greenyShown: false
};

/* ============================================================
   CANVAS REFS  — assigned in startGame() so DOM is ready
   ============================================================ */
var canvas = null;
var ctx    = null;
var W      = 0;
var H      = 0;

function resizeCanvas() {
  if (!canvas) return;
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

/* ============================================================
   SAVE / LOAD
   ============================================================ */
function loadSaves() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e) { return []; }
}

function saveRun(won, notebooks, timeMs, wrongAnswers) {
  var runs = loadSaves();
  runs.push({ won:won, notebooks:notebooks, timeMs:timeMs, wrongAnswers:wrongAnswers, date:Date.now() });
  localStorage.setItem(SAVE_KEY, JSON.stringify(runs));
}

function bestTime() {
  var wins = loadSaves().filter(function(r){ return r.won; });
  if (!wins.length) return null;
  return Math.min.apply(null, wins.map(function(r){ return r.timeMs; }));
}

/* ============================================================
   MAP  — map[y][x]: 1=wall, 0=floor
   TODO: Replace with a hand-crafted array for a fixed school layout
   ============================================================ */
var map = [];

function generateMaze() {
  var y, x;
  map = [];
  for (y = 0; y < MAZE_H; y++) {
    map.push([]);
    for (x = 0; x < MAZE_W; x++) map[y].push(1);
  }

  // Recursive backtracker carve
  function carve(cx, cy) {
    var dirs = [[0,-2],[2,0],[0,2],[-2,0]].sort(function(){ return Math.random()-0.5; });
    for (var i=0; i<dirs.length; i++) {
      var dx=dirs[i][0], dy=dirs[i][1];
      var nx=cx+dx, ny=cy+dy;
      if (nx>0 && ny>0 && nx<MAZE_W-1 && ny<MAZE_H-1 && map[ny][nx]===1) {
        map[cy+dy/2][cx+dx/2]=0;
        map[ny][nx]=0;
        carve(nx,ny);
      }
    }
  }
  map[1][1]=0; carve(1,1);

  // Extra openings for a more school-like open layout
  for (var i=0; i<40; i++) {
    var ex = 1+Math.floor(Math.random()*Math.floor((MAZE_W-2)/2))*2;
    var ey = 1+Math.floor(Math.random()*Math.floor((MAZE_H-2)/2))*2;
    if (Math.random()<0.5 && ex+1<MAZE_W-1) map[ey][ex+1]=0;
    else if (ey+1<MAZE_H-1) map[ey+1][ex]=0;
  }
}

/* ============================================================
   MAP HELPERS
   ============================================================ */
function wallAt(wx, wy) {
  var mx=Math.floor(wx/CELL), my=Math.floor(wy/CELL);
  if (mx<0||my<0||mx>=MAZE_W||my>=MAZE_H) return true;
  return map[my][mx]===1;
}

function openCells(exclude) {
  exclude = exclude||[];
  var cells=[];
  for (var y=1;y<MAZE_H-1;y++)
    for (var x=1;x<MAZE_W-1;x++)
      if (map[y][x]===0 && !exclude.some(function(e){return e[0]===x&&e[1]===y;}))
        cells.push([x,y]);
  return cells;
}

function randomCell(exclude) {
  var cells=openCells(exclude);
  return cells[Math.floor(Math.random()*cells.length)];
}

function cellCenter(cx, cy) {
  return { x:cx*CELL+CELL/2, y:cy*CELL+CELL/2 };
}

/* ============================================================
   MATH QUESTION GENERATOR
   TODO: Make the 3rd question in each notebook impossible (like Baldi)
   ============================================================ */
function makeQ() {
  var ops=['+','-','x'];
  var op=ops[Math.floor(Math.random()*ops.length)];
  var a,b,ans;
  if(op==='+'){a=ri(1,20);b=ri(1,20);ans=a+b;}
  else if(op==='-'){a=ri(10,30);b=ri(1,10);ans=a-b;}
  else{a=ri(2,9);b=ri(2,9);ans=a*b;}
  return {text:a+' '+op+' '+b+' = ?', answer:ans};
}
function ri(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

/* ============================================================
   INIT GAME  — fresh state every run
   ============================================================ */
function initGame() {
  generateMaze();

  var used=[];
  var sc=randomCell(used); used.push(sc);
  var spos=cellCenter(sc[0],sc[1]);

  G.state       = 'playing';
  G.nbCollected = 0;
  G.wrongCount  = 0;
  G.startTime   = performance.now();
  G.endTime     = 0;
  G.mathOpen    = false;
  G.mathNB      = null;
  G.mathPhase   = 0;
  G.inDetention = false;
  G.detTimer    = 0;
  G.showMap     = false;
  G.greenyShown = false;
  G.heldItems   = [null,null,null];

  G.player = {
    x:spos.x, y:spos.y,
    angle:Math.random()*Math.PI*2,
    stamina:100, maxStamina:100
  };

  // Spawn notebooks (7 total like Baldi)
  // TODO: If you want fixed notebook positions, replace randomCell() with hardcoded cells
  G.notebooks=[];
  for (var i=0;i<TOTAL_NB;i++) {
    var c=randomCell(used); used.push(c);
    var p=cellCenter(c[0],c[1]);
    G.notebooks.push({
      id:i, x:p.x, y:p.y, collected:false,
      // Each notebook has 3 questions (like Baldi's)
      qs:[makeQ(),makeQ(),makeQ()]
    });
  }

  // Spawn Greeny
  G.characters=[];
  var gc=randomCell(used); used.push(gc);
  var gp=cellCenter(gc[0],gc[1]);
  G.characters.push({
    id:'greeny', x:gp.x, y:gp.y, wanderAngle:0,
    angry:false, angryMs:0, def:CHARS.greeny
  });

  // TODO: Spawn more characters here
  // var c2=randomCell(used); used.push(c2); ...

  // Spawn floor items
  G.floorItems=[];
  var ikeys=Object.keys(ITEMS);
  for (var j=0;j<4;j++) {
    var ic=randomCell(used); used.push(ic);
    var ip=cellCenter(ic[0],ic[1]);
    G.floorItems.push({ type:ikeys[j%ikeys.length], x:ip.x, y:ip.y, collected:false });
  }

  updateHeldHUD();
  updateHUD();
}

/* ============================================================
   MATH PUZZLE
   ============================================================ */
function openMath(nb) {
  if (G.mathOpen) return;
  G.mathOpen=true; G.mathNB=nb; G.mathPhase=0;
  showMathUI();
}

function showMathUI() {
  var nb=G.mathNB, phase=G.mathPhase;
  document.getElementById('nb-num').textContent='Notebook #'+(nb.id+1)+'  ('+(phase+1)+'/3)';
  document.getElementById('nb-question').textContent=nb.qs[phase].text;
  document.getElementById('nb-input').value='';
  document.getElementById('nb-wrong').textContent='';
  document.getElementById('nb-flash').style.display='flex';
  setTimeout(function(){ document.getElementById('nb-input').focus(); },60);
}

function submitAnswer() {
  var val=parseInt(document.getElementById('nb-input').value,10);
  if (isNaN(val)) return;
  var nb=G.mathNB, phase=G.mathPhase;

  if (val===nb.qs[phase].answer) {
    // Correct
    if (phase<2) {
      G.mathPhase++; showMathUI();
    } else {
      // All 3 done — notebook collected!
      nb.collected=true; G.nbCollected++;
      document.getElementById('nb-flash').style.display='none';
      G.mathOpen=false; G.mathNB=null;
      updateHUD();
      if (G.nbCollected>=TOTAL_NB) triggerWin();
    }
  } else {
    // Wrong — anger Greeny (like Baldi's ruler slap getting faster)
    G.wrongCount++;
    document.getElementById('nb-wrong').textContent='Wrong! ('+G.wrongCount+' mistake'+(G.wrongCount>1?'s':'')+')';
    document.getElementById('nb-input').value='';
    var greeny=G.characters.find(function(c){return c.id==='greeny';});
    if (greeny) {
      greeny.angry=true; greeny.angryMs=5000;
      // Teleport Greeny closer every 3 wrong answers
      if (G.wrongCount%3===0) teleportCloser(greeny, CELL*4);
    }
    // TODO: Play wrong-answer sound / speed up ruler slap here
  }
}

function teleportCloser(ch, maxDist) {
  var p=G.player;
  var candidates=openCells().sort(function(){return Math.random()-0.5;}).slice(0,30);
  var best=null, bestD=Infinity;
  for (var i=0;i<candidates.length;i++) {
    var pos=cellCenter(candidates[i][0],candidates[i][1]);
    var d=Math.hypot(pos.x-p.x, pos.y-p.y);
    if (d<maxDist && d<bestD && d>CELL) { best=pos; bestD=d; }
  }
  if (best) { ch.x=best.x; ch.y=best.y; }
}

/* ============================================================
   CHARACTER AI
   ============================================================ */
function updateChars(dt) {
  var p=G.player;
  for (var i=0;i<G.characters.length;i++) {
    var ch=G.characters[i], def=ch.def;
    var dist=Math.hypot(ch.x-p.x, ch.y-p.y);
    var spd=(def.baseSpeed+G.nbCollected*def.speedPerNB)*(ch.angry?1.6:1.0);

    // LOS / hearing
    if (dist<def.hearR || (dist<def.losR && hasLOS(ch.x,ch.y,p.x,p.y))) {
      ch.angry=true; ch.angryMs=Math.max(ch.angryMs,3000);
    }
    if (ch.angryMs>0) {
      ch.angryMs-=dt*1000;
      if (ch.angryMs<=0){ch.angryMs=0; ch.angry=false;}
    }

    if (ch.angry || dist<CELL*4) {
      moveToward(ch, p.x, p.y, spd*dt*60);
    } else {
      wander(ch, spd*0.4*dt*60);
    }

    // Catch player
    if (dist<def.catchR) { catchPlayer(); return; }
  }

  // Hearing HUD indicator
  var anyNear=G.characters.some(function(c){return Math.hypot(c.x-p.x,c.y-p.y)<CHARS.greeny.hearR;});
  document.getElementById('hud-hearing').style.display=anyNear?'block':'none';
}

function moveToward(ch, tx, ty, step) {
  var ang=Math.atan2(ty-ch.y, tx-ch.x);
  var nx=ch.x+Math.cos(ang)*step, ny=ch.y+Math.sin(ang)*step;
  if(!wallAt(nx,ch.y)) ch.x=nx;
  if(!wallAt(ch.x,ny)) ch.y=ny;
}

function wander(ch, step) {
  ch.wanderAngle=(ch.wanderAngle||0)+(Math.random()-0.5)*0.08;
  var nx=ch.x+Math.cos(ch.wanderAngle)*step, ny=ch.y+Math.sin(ch.wanderAngle)*step;
  if(!wallAt(nx,ch.y)) ch.x=nx; else ch.wanderAngle+=Math.PI/2;
  if(!wallAt(ch.x,ny)) ch.y=ny; else ch.wanderAngle+=Math.PI/2;
}

function hasLOS(x1,y1,x2,y2) {
  var dx=x2-x1, dy=y2-y1, d=Math.sqrt(dx*dx+dy*dy);
  var steps=Math.ceil(d/8);
  for(var i=0;i<=steps;i++) if(wallAt(x1+dx*(i/steps),y1+dy*(i/steps))) return false;
  return true;
}

/* ============================================================
   PLAYER MOVEMENT
   ============================================================ */
function updatePlayer(dt) {
  if(G.mathOpen||G.inDetention||G.state!=='playing'||!G.player) return;
  var p=G.player;
  var run=keys.ShiftLeft||keys.ShiftRight;
  if(run&&p.stamina>0) p.stamina=Math.max(0,p.stamina-dt*28);
  else if(!run) p.stamina=Math.min(p.maxStamina,p.stamina+dt*12);
  var spd=(run&&p.stamina>0)?RUN_SPD:(run?PLAYER_SPD*0.5:PLAYER_SPD);
  var step=spd*dt*60;
  var nx,ny;

  if(keys.KeyW||keys.ArrowUp){
    nx=p.x+Math.cos(p.angle)*step; ny=p.y+Math.sin(p.angle)*step;
    if(!wallAt(nx,p.y))p.x=nx; if(!wallAt(p.x,ny))p.y=ny;
  }
  if(keys.KeyS||keys.ArrowDown){
    nx=p.x-Math.cos(p.angle)*step*0.6; ny=p.y-Math.sin(p.angle)*step*0.6;
    if(!wallAt(nx,p.y))p.x=nx; if(!wallAt(p.x,ny))p.y=ny;
  }
  if(keys.KeyA){
    nx=p.x+Math.cos(p.angle-Math.PI/2)*step*0.75; ny=p.y+Math.sin(p.angle-Math.PI/2)*step*0.75;
    if(!wallAt(nx,p.y))p.x=nx; if(!wallAt(p.x,ny))p.y=ny;
  }
  if(keys.KeyD){
    nx=p.x+Math.cos(p.angle+Math.PI/2)*step*0.75; ny=p.y+Math.sin(p.angle+Math.PI/2)*step*0.75;
    if(!wallAt(nx,p.y))p.x=nx; if(!wallAt(p.x,ny))p.y=ny;
  }
  if(keys.ArrowLeft)  p.angle-=TURN_SPD;
  if(keys.ArrowRight) p.angle+=TURN_SPD;

  checkNearNB();
  checkNearItem();
}

function checkNearNB() {
  if(G.mathOpen) return;
  for(var i=0;i<G.notebooks.length;i++){
    var nb=G.notebooks[i];
    if(nb.collected) continue;
    if(Math.hypot(nb.x-G.player.x,nb.y-G.player.y)<CELL*0.88){openMath(nb);return;}
  }
}

function checkNearItem() {
  var el=document.getElementById('hud-pickup');
  for(var i=0;i<G.floorItems.length;i++){
    var it=G.floorItems[i];
    if(it.collected) continue;
    if(Math.hypot(it.x-G.player.x,it.y-G.player.y)<CELL*0.9){

      el.textContent='[ E ] Pick up '+ITEMS[it.type].label.replace('\n',' ');
      if(keys.KeyE){ pickupItem(it); keys.KeyE=false; el.style.display='none'; }

}

/* ============================================================
   RAYCASTER — WALL RENDERING
   TODO: Swap fillStyle with ctx.drawImage() for textured walls
   ============================================================ */
var zBuf=[];

function renderWalls() {
  zBuf=[];
  for(var i=0;i<NUM_RAYS;i++) zBuf.push(MAX_DIST);

  // Ceiling
  // TODO: Replace with ceiling texture
  ctx.fillStyle='#aaddaa';
  ctx.fillRect(0,0,W,H/2);

  // Floor
  // TODO: Replace with floor texture / tiled image
  ctx.fillStyle='#887744';
  ctx.fillRect(0,H/2,W,H/2);

  var colW=W/NUM_RAYS;
  for(var i=0;i<NUM_RAYS;i++){
    var ray=G.player.angle-HALF_FOV+(i/NUM_RAYS)*FOV;
    var hit=castRay(ray);
    var corr=hit.dist*Math.cos(ray-G.player.angle);
    zBuf[i]=corr;
    if(!hit.wall) continue;
    var wallH=Math.min(H*4,(CELL/corr)*H*0.85);
    var top=(H-wallH)/2;
    // Shade walls by distance + side (N/S darker than E/W)
    // TODO: Replace with texture: ctx.drawImage(wallTex, texX, 0, 1, TEX_H, col, top, colW, wallH)
    var shade=Math.max(30,Math.min(220,220-corr*0.55));
    var sm=hit.side?0.72:1.0;
    var r=Math.floor(shade*0.32*sm), g=Math.floor(shade*0.78*sm), b=Math.floor(shade*0.32*sm);
    ctx.fillStyle='rgb('+r+','+g+','+b+')';
    ctx.fillRect(Math.floor(i*colW),Math.floor(top),Math.ceil(colW)+1,Math.ceil(wallH));
  }
}

function castRay(angle) {
  var cos=Math.cos(angle), sin=Math.sin(angle);
  for(var d=1;d<MAX_DIST;d+=3){
    var rx=G.player.x+cos*d, ry=G.player.y+sin*d;
    var mx=Math.floor(rx/CELL), my=Math.floor(ry/CELL);
    if(mx<0||my<0||mx>=MAZE_W||my>=MAZE_H) return {dist:d,wall:1,side:0};
    if(map[my][mx]===1){
      var prx=G.player.x+cos*(d-3), pry=G.player.y+sin*(d-3);
      var side=(Math.floor(prx/CELL)!==mx)?0:1;
      return {dist:d,wall:1,side:side};
    }
  }
  return {dist:MAX_DIST,wall:0,side:0};
}

/* ============================================================
   SPRITE PROJECTION
   ============================================================ */
function projectEnt(wx, wy) {
  var dx=wx-G.player.x, dy=wy-G.player.y;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<1) return null;
  var rel=Math.atan2(dy,dx)-G.player.angle;
  while(rel<-Math.PI) rel+=Math.PI*2;
  while(rel>Math.PI)  rel-=Math.PI*2;
  if(Math.abs(rel)>HALF_FOV+0.35) return null;
  var sx=(W/2)+Math.tan(rel)*(W/2)/Math.tan(HALF_FOV);
  var h=Math.min(H*1.5,(CELL/dist)*H*0.85);
  return {sx:sx,dist:dist,h:h};
}

function renderSprites() {
  var sprites=[];
  var i;
  for(i=0;i<G.notebooks.length;i++){
    var nb=G.notebooks[i]; if(nb.collected) continue;
    var sp=projectEnt(nb.x,nb.y); if(sp) sprites.push({sp:sp,kind:'nb',obj:nb});
  }
  for(i=0;i<G.floorItems.length;i++){
    var it=G.floorItems[i]; if(it.collected) continue;
    var sp=projectEnt(it.x,it.y); if(sp) sprites.push({sp:sp,kind:'item',obj:it});
  }
  for(i=0;i<G.characters.length;i++){
    var ch=G.characters[i];
    var sp=projectEnt(ch.x,ch.y); if(sp) sprites.push({sp:sp,kind:'char',obj:ch});
  }
  sprites.sort(function(a,b){return b.sp.dist-a.sp.dist;});

  var colW=W/NUM_RAYS;
  for(i=0;i<sprites.length;i++){
    var s=sprites[i]; if(s.sp.dist>MAX_DIST*0.92) continue;
    var sw=s.sp.h*0.85, sx=s.sp.sx-sw/2, sy=(H-s.sp.h)/2;
    var c0=Math.floor(sx/colW), c1=Math.floor((sx+sw)/colW);
    var vis=false;
    for(var c=Math.max(0,c0);c<=Math.min(NUM_RAYS-1,c1);c++) if(zBuf[c]>=s.sp.dist){vis=true;break;}
    if(!vis) continue;
    ctx.save();
    ctx.globalAlpha=Math.min(1,Math.max(0,1-s.sp.dist/(MAX_DIST*0.75)));
    if(s.kind==='nb')   drawNotebook(sx,sy,sw,s.sp.h,s.sp.dist);
    if(s.kind==='item') drawItem(sx,sy,sw,s.sp.h,s.obj.type);
    if(s.kind==='char') drawChar(sx,sy,sw,s.sp.h,s.obj);
    ctx.restore();
  }
}

function drawNotebook(x,y,w,h,dist) {

  ctx.fillStyle='#ffffaa'; ctx.fillRect(x,y,w,h);

function drawItem(x,y,w,h,type) {
  // TODO: ctx.drawImage(itemImgs[type], x, y, w, h);
  var def=ITEMS[type];
  ctx.fillStyle=def.color; ctx.fillRect(x+w*0.15,y+h*0.1,w*0.7,h*0.8);
  ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(x+w*0.15,y+h*0.1,w*0.7,h*0.8);
  ctx.fillStyle='#000'; ctx.font=Math.max(9,Math.floor(h*0.14))+'px Schoolbell,cursive';
  ctx.textAlign='center';
  var lns=def.label.split('\n');
  for(var li=0;li<lns.length;li++) ctx.fillText(lns[li],x+w/2,y+h*0.45+li*h*0.18);

}

function drawChar(x,y,w,h,ch) {
  // TODO: ctx.drawImage(charSheet, frameX, 0, frameW, frameH, x, y, w, h);
  var def=ch.def;
  // Head
  ctx.fillStyle=def.color; ctx.fillRect(x+w*0.1,y,w*0.8,h*0.52);
  // Eyes
  ctx.fillStyle='#fff';
  ctx.fillRect(x+w*0.18,y+h*0.09,w*0.19,h*0.19);
  ctx.fillRect(x+w*0.63,y+h*0.09,w*0.19,h*0.19);
  // Pupils — shift toward player when angry
  ctx.fillStyle='#000';
  var ps=ch.angry?0.04:0;
  ctx.fillRect(x+w*(0.24+ps),y+h*0.12,w*0.09,h*0.13);
  ctx.fillRect(x+w*(0.67+ps),y+h*0.12,w*0.09,h*0.13);
  // Eyebrows
  ctx.strokeStyle='#003300'; ctx.lineWidth=Math.max(1.5,h*0.025);
  ctx.beginPath(); ctx.moveTo(x+w*0.14,y+h*(ch.angry?0.05:0.06)); ctx.lineTo(x+w*0.38,y+h*(ch.angry?0.10:0.06)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+w*0.62,y+h*(ch.angry?0.10:0.06)); ctx.lineTo(x+w*0.86,y+h*(ch.angry?0.05:0.06)); ctx.stroke();
  // Mouth
  ctx.strokeStyle='#003300'; ctx.lineWidth=Math.max(1.5,h*0.022);
  ctx.beginPath();
  if(ch.angry){ ctx.moveTo(x+w*0.28,y+h*0.40); ctx.lineTo(x+w*0.72,y+h*0.40); }
  else { ctx.arc(x+w/2,y+h*0.36,w*0.18,0.15,Math.PI-0.15); }
  ctx.stroke();
  // Body + arms
  ctx.fillStyle='#1a7a1a'; ctx.fillRect(x+w*0.18,y+h*0.52,w*0.64,h*0.48);
  ctx.fillRect(x,y+h*0.52,w*0.18,h*0.32); ctx.fillRect(x+w*0.82,y+h*0.52,w*0.18,h*0.32);
  // Ruler when angry (TODO: replace with ruler sprite)
  if(ch.angry){
    ctx.fillStyle='#aa8800'; ctx.fillRect(x+w*0.82,y+h*0.52,w*0.07,h*0.6);
    ctx.strokeStyle='#664400'; ctx.lineWidth=1; ctx.strokeRect(x+w*0.82,y+h*0.52,w*0.07,h*0.6);
    ctx.fillStyle='rgba(255,0,0,0.1)'; ctx.fillRect(x,y,w,h);
  }
  // Outline for hand-drawn look
  ctx.strokeStyle='#000'; ctx.lineWidth=Math.max(1,h*0.01); ctx.strokeRect(x+w*0.1,y,w*0.8,h*0.52);
}

function renderMinimap() {

  mctx.fillStyle='#000'; mctx.fillRect(0,0,140,140);

    mctx.fillStyle=map[y][x]===1?'#226622':'#111a11';
    mctx.fillRect(x*cs,y*cs,cs,cs);

  for(var i=0;i<G.notebooks.length;i++){
    var nb=G.notebooks[i]; if(nb.collected) continue;
    mctx.fillStyle='#ffff00'; mctx.fillRect(nb.x/CELL*cs-2,nb.y/CELL*cs-2,4,4);

  for(var i=0;i<G.characters.length;i++){
    var ch=G.characters[i];
    if(Math.hypot(ch.x-G.player.x,ch.y-G.player.y)<CELL*9){
      mctx.fillStyle='#ff4444'; mctx.fillRect(ch.x/CELL*cs-2,ch.y/CELL*cs-2,4,4);

var animId=null, lastTime=0;

function gameLoop(ts) {
  var dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  if(G.state==='playing' && !G.greenyShown && G.player){
    updatePlayer(dt);
    updateChars(dt);
    tickDetention(dt);
    updateHUD();
    renderFrame();
    if(G.showMap) renderMinimap();
  }
  animId=requestAnimationFrame(gameLoop);
}

  if(e.code==='Enter'&&G.mathOpen&&G.player){e.preventDefault();submitAnswer();}
  if(e.code==='Escape'&&G.mathOpen&&G.player){document.getElementById('nb-flash').style.display='none';G.mathOpen=false;G.mathNB=null;}
  if(e.code==='Digit1'&&G.player) useSlot(0);
  if(e.code==='Digit2'&&G.player) useSlot(1);
  if(e.code==='Digit3'&&G.player) useSlot(2);
  if(e.code==='KeyM'&&G.state==='playing'&&G.player){
    G.showMap=!G.showMap;
    document.getElementById('minimap').style.display=G.showMap?'block':'none';
  }
});
document.addEventListener('keyup',function(e){keys[e.code]=false;});

/* Mouse look */
document.addEventListener('click',function(e){
  if(G.state==='playing'&&canvas&&e.target===canvas) canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange',function(){
  var locked=document.pointerLockElement===canvas;
  document.getElementById('lock-hint').style.display=(locked||G.state!=='playing')?'none':'block';
});
document.addEventListener('mousemove',function(e){
  if(!canvas||document.pointerLockElement!==canvas) return;
  if(G.state!=='playing'||G.mathOpen||!G.player) return;
  G.player.angle+=e.movementX*MOUSE_SENS;
});

/* ============================================================
   BOOT
   ============================================================ */
refreshTitleBest();
</script>
</body>
</html>
